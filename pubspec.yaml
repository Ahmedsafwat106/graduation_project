name: graduation_project
description: A Flutter job-matching and AI-driven recruitment platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  http: ^1.2.2
  dio: ^5.4.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.2
  json_annotation: ^4.9.0
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  cached_network_image: ^3.4.1
  animations: ^2.0.10
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/